<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personality Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2em;
      background-color: #f9f9f9;
    }
    h1 {
      text-align: center;
      color: #444;
    }
    form {
      max-width: 600px;
      margin: 0 auto;
      background-color: #fff;
      padding: 2em;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 1em;
      font-weight: bold;
    }
    select, input[type="date"], input[type="number"] {
      width: 100%;
      padding: 0.5em;
      margin-top: 0.5em;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 1.5em;
      padding: 0.75em 1.5em;
      background-color: #5c6bc0;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1em;
    }
    button:hover {
      background-color: #3f51b5;
    }
    #result {
      margin-top: 2em;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
      background-color: #fff;
      padding: 2em;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h1>🌟 Discover Your Inner Self 🌟</h1>
  <form id="quizForm">
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob" required />

    <label for="color">Favorite Color:</label>
    <select id="color" name="color" required>
      <option value="">Select</option>
      <option value="red">Red</option>
      <option value="blue">Blue</option>
      <option value="green">Green</option>
      <option value="yellow">Yellow</option>
    </select>

    <label for="food">Favorite Food:</label>
    <select id="food" name="food" required>
      <option value="">Select</option>
      <option value="pizza">Pizza</option>
      <option value="sushi">Sushi</option>
      <option value="salad">Salad</option>
      <option value="tacos">Tacos</option>
    </select>

    <label for="dance">Pick a Dance Style:</label>
    <select id="dance" name="dance" required>
      <option value="">Select</option>
      <option value="salsa">Salsa</option>
      <option value="waltz">Waltz</option>
      <option value="floss">Floss</option>
      <option value="freestyle">Freestyle</option>
    </select>

    <label for="adventure">Adventure Level (1–10):</label>
    <input type="number" id="adventure" name="adventure" min="1" max="10" required />

    <button type="submit">Reveal Insights ✨</button>
  </form>

  <div id="result" style="display:none;">
    <h2>Your Results</h2>
    <div id="resultText"></div>
  </div>

  <script>
    document.getElementById("quizForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const color = document.getElementById("color").value;
      const food = document.getElementById("food").value;
      const dance = document.getElementById("dance").value;
      const adventure = document.getElementById("adventure").value;

      const dobInput = document.getElementById("dob").value;
      if (!dobInput) {
        alert("Please select a date of birth.");
        return;
      }

      const dobDate = new Date(dobInput);
      const dob = `${dobDate.getMonth() + 1}/${dobDate.getDate()}/${dobDate.getFullYear()}`;

      fetch("https://sheetdb.io/api/v1/h9hhtfe3oofib", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ data: [{ dob: dob }] })
      })
      .then(response => response.json())
      .then(data => {
        console.log("DOB sent to SheetDB:", data);
      })
      .catch(error => {
        console.error("Error sending DOB to SheetDB:", error);
      });

      const month = dobDate.getMonth() + 1;
      const day = dobDate.getDate();
      const zodiac = getZodiacSign(month, day);

      let resultText = "";

      resultText += `<p><strong>🎨 Favorite Color:</strong> `;
      switch (color) {
        case "red":
          resultText += `You’re vibrant and energetic...`;
          break;
        case "blue":
          resultText += `You’re calm and introspective...`;
          break;
        case "green":
          resultText += `You’re grounded and compassionate...`;
          break;
        case "yellow":
          resultText += `You’re joyful and curious...`;
          break;
        default:
          resultText += `You’re imaginative and unique...`;
      }
      resultText += `</p>`;

      resultText += `<p><strong>🍽 Favorite Food:</strong> Loving ${food} shows your appreciation for life’s flavors and moments.</p>`;

      resultText += `<p><strong>💃 Dance Style:</strong> `;
      switch (dance) {
        case "salsa":
          resultText += `You're confident and love connection...`;
          break;
        case "waltz":
          resultText += `You appreciate grace and structure...`;
          break;
        case "floss":
          resultText += `You're playful and trend-aware...`;
          break;
        default:
          resultText += `You're expressive and free...`;
      }
      resultText += `</p>`;

      resultText += `<p><strong>🧭 Adventure Level:</strong> `;
      if (adventure > 7) {
        resultText += `You're a bold explorer...`;
      } else if (adventure > 4) {
        resultText += `You enjoy balance and spontaneous fun...`;
      } else {
        resultText += `You cherish comfort and stability...`;
      }
      resultText += `</p>`;

      resultText += `<p><strong>🔮 Zodiac Sign:</strong> As a <strong>${zodiac}</strong>, you are...`;
      switch (zodiac) {
        case "Aries":
          resultText += ` bold and a go-getter.`;
          break;
        case "Taurus":
          resultText += ` steady and reliable.`;
          break;
        case "Gemini":
          resultText += ` witty and curious.`;
          break;
        case "Cancer":
          resultText += ` intuitive and nurturing.`;
          break;
        case "Leo":
          resultText += ` confident and creative.`;
          break;
        case "Virgo":
          resultText += ` practical and thoughtful.`;
          break;
        case "Libra":
          resultText += ` fair-minded and diplomatic.`;
          break;
        case "Scorpio":
          resultText += ` passionate and deep.`;
          break;
        case "Sagittarius":
          resultText += ` adventurous and free-spirited.`;
          break;
        case "Capricorn":
          resultText += ` disciplined and ambitious.`;
          break;
        case "Aquarius":
          resultText += ` innovative and unique.`;
          break;
        default:
          resultText += ` compassionate and artistic.`;
      }
      resultText += `</p>`;

      document.getElementById("resultText").innerHTML = resultText;
      document.getElementById("result").style.display = "block";
    });

    function getZodiacSign(month, day) {
      const zodiac = [
        { sign: "Capricorn", lastDay: 19 },
        { sign: "Aquarius", lastDay: 18 },
        { sign: "Pisces", lastDay: 20 },
        { sign: "Aries", lastDay: 19 },
        { sign: "Taurus", lastDay: 20 },
        { sign: "Gemini", lastDay: 20 },
        { sign: "Cancer", lastDay: 22 },
        { sign: "Leo", lastDay: 22 },
        { sign: "Virgo", lastDay: 22 },
        { sign: "Libra", lastDay: 22 },
        { sign: "Scorpio", lastDay: 21 },
        { sign: "Sagittarius", lastDay: 21 },
      ];
      return zodiac[month - 1].sign;
    }
  </script>
</body>
</html>
