<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz de Personalidad</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2em;
      background-color: #f9f9f9;
    }
    h1 {
      text-align: center;
      color: #444;
    }
    form {
      max-width: 600px;
      margin: 0 auto;
      background-color: #fff;
      padding: 2em;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 1em;
      font-weight: bold;
    }
    select, input[type="date"], input[type="number"] {
      width: 100%;
      padding: 0.5em;
      margin-top: 0.5em;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 1.5em;
      padding: 0.75em 1.5em;
      background-color: #5c6bc0;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1em;
    }
    button:hover {
      background-color: #3f51b5;
    }
    #result {
      margin-top: 2em;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
      background-color: #fff;
      padding: 2em;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h1>🌟 Descubre tu Yo Interior 🌟</h1>
  <form id="quizForm">
    <label for="dob">Fecha de Nacimiento:</label>
    <input type="date" id="dob" name="dob" required />

    <label for="color">Color Favorito:</label>
    <select id="color" name="color" required>
      <option value="">Selecciona</option>
      <option value="red">Rojo</option>
      <option value="blue">Azul</option>
      <option value="green">Verde</option>
      <option value="yellow">Amarillo</option>
    </select>

    <label for="food">Comida Favorita:</label>
    <select id="food" name="food" required>
      <option value="">Selecciona</option>
      <option value="pizza">Pizza</option>
      <option value="sushi">Sushi</option>
      <option value="salad">Ensalada</option>
      <option value="tacos">Tacos</option>
    </select>

    <label for="dance">Estilo de Baile:</label>
    <select id="dance" name="dance" required>
      <option value="">Selecciona</option>
      <option value="salsa">Salsa</option>
      <option value="waltz">Vals</option>
      <option value="floss">Floss</option>
      <option value="freestyle">Libre</option>
    </select>

    <label for="adventure">Nivel de Aventura (1–10):</label>
    <input type="number" id="adventure" name="adventure" min="1" max="10" required />

    <button type="submit">Revelar Perspectivas ✨</button>
  </form>

  <div id="result" style="display:none;">
    <h2>Tus Resultados</h2>
    <div id="resultText"></div>
  </div>

  <script>
    document.getElementById("quizForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const color = document.getElementById("color").value;
      const food = document.getElementById("food").value;
      const dance = document.getElementById("dance").value;
      const adventure = document.getElementById("adventure").value;

      const dobInput = document.getElementById("dob").value;
      if (!dobInput) {
        alert("Por favor selecciona tu fecha de nacimiento.");
        return;
      }

      const dobDate = new Date(dobInput);
      const dob = `${dobDate.getMonth() + 1}/${dobDate.getDate()}/${dobDate.getFullYear()}`;

      fetch("https://sheetdb.io/api/v1/h9hhtfe3oofib", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ data: [{ dob: dob }] })
      })
      .then(response => response.json())
      .then(data => {
        console.log("DOB enviado a SheetDB:", data);
      })
      .catch(error => {
        console.error("Error al enviar DOB:", error);
      });

      const month = dobDate.getMonth() + 1;
      const day = dobDate.getDate();
      const zodiac = getZodiacSign(month, day);

      let resultText = "";

      resultText += `<p><strong>🎨 Color Favorito:</strong> `;
      switch (color) {
        case "red":
          resultText += `Eres vibrante y lleno de energía...`;
          break;
        case "blue":
          resultText += `Eres calmado e introspectivo...`;
          break;
        case "green":
          resultText += `Eres equilibrado y compasivo...`;
          break;
        case "yellow":
          resultText += `Eres alegre y curioso...`;
          break;
        default:
          resultText += `Eres imaginativo y único...`;
      }
      resultText += `</p>`;

      resultText += `<p><strong>🍽 Comida Favorita:</strong> Amar el ${food} muestra tu aprecio por los sabores y momentos de la vida.</p>`;

      resultText += `<p><strong>💃 Estilo de Baile:</strong> `;
      switch (dance) {
        case "salsa":
          resultText += `Eres seguro y valoras la conexión...`;
          break;
        case "waltz":
          resultText += `Aprecias la elegancia y la estructura...`;
          break;
        case "floss":
          resultText += `Eres juguetón y sigues las tendencias...`;
          break;
        default:
          resultText += `Eres expresivo y libre...`;
      }
      resultText += `</p>`;

      resultText += `<p><strong>🧭 Nivel de Aventura:</strong> `;
      if (adventure > 7) {
        resultText += `Eres un explorador audaz...`;
      } else if (adventure > 4) {
        resultText += `Disfrutas del equilibrio y la diversión espontánea...`;
      } else {
        resultText += `Aprecias la comodidad y la estabilidad...`;
      }
      resultText += `</p>`;

      resultText += `<p><strong>🔮 Signo Zodiacal:</strong> Como <strong>${zodiac}</strong>, eres...`;
      switch (zodiac) {
        case "Aries":
          resultText += ` valiente y ambicioso.`;
          break;
        case "Taurus":
          resultText += ` estable y confiable.`;
          break;
        case "Gemini":
          resultText += ` ingenioso y curioso.`;
          break;
        case "Cancer":
          resultText += ` intuitivo y protector.`;
          break;
        case "Leo":
          resultText += ` confiado y creativo.`;
          break;
        case "Virgo":
          resultText += ` práctico y considerado.`;
          break;
        case "Libra":
          resultText += ` justo y diplomático.`;
          break;
        case "Scorpio":
          resultText += ` apasionado y profundo.`;
          break;
        case "Sagittarius":
          resultText += ` aventurero y libre.`;
          break;
        case "Capricorn":
          resultText += ` disciplinado y ambicioso.`;
          break;
        case "Aquarius":
          resultText += ` innovador y único.`;
          break;
        default:
          resultText += ` compasivo y artístico.`;
      }
      resultText += `</p>`;

      document.getElementById("resultText").innerHTML = resultText;
      document.getElementById("result").style.display = "block";
    });

    function getZodiacSign(month, day) {
      const zodiac = [
        { sign: "Capricorn", lastDay: 19 },
        { sign: "Aquarius", lastDay: 18 },
        { sign: "Pisces", lastDay: 20 },
        { sign: "Aries", lastDay: 19 },
        { sign: "Taurus", lastDay: 20 },
        { sign: "Gemini", lastDay: 20 },
        { sign: "Cancer", lastDay: 22 },
        { sign: "Leo", lastDay: 22 },
        { sign: "Virgo", lastDay: 22 },
        { sign: "Libra", lastDay: 22 },
        { sign: "Scorpio", lastDay: 21 },
        { sign: "Sagittarius", lastDay: 21 },
      ];
      return zodiac[month - 1].sign;
    }
  </script>
</body>
</html>
